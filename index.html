<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loot Manager</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #1c2330; --muted: #68718a;
  --line: #dde1ea; --accent: #2f6fed; --accent-ink: #ffffff;
  --danger: #c93030; --ok: #1d8f4e; --warn-bg: #fff6e5;
  --r-common: #8a93a8; --r-rare: #2f8fd8; --r-epic: #9b59d0; --r-legendary: #e8912b;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.4;
}
button, input, select, textarea { font: inherit; color: inherit; }
h2 { font-size: 1.05rem; margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

#banner {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 100; max-width: min(92vw, 560px);
  background: var(--ink); color: #fff; border-radius: 10px;
  padding: 10px 14px; display: flex; gap: 10px; align-items: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
#banner button { background: none; border: 0; color: #fff; font-size: 1.1rem; cursor: pointer; }
/* display:flex вище перебиває [hidden]{display:none} браузера — без цього правила
   порожня плашка висить на екрані постійно */
#banner[hidden] { display: none; }

header.appbar {
  position: sticky; top: 0; z-index: 20; background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex; gap: 8px; align-items: center; padding: 10px 12px;
}
header.appbar .brand { font-weight: 700; white-space: nowrap; }
/* v3.3.0: мова перемикається одним кліком по прапорцю, а не через випадний список */
.lang-switch { display: flex; gap: 4px; flex: 0 0 auto; }
.lang-btn { display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  padding: 4px 7px; font-size: 0.8rem; font-weight: 600; color: var(--muted);
  line-height: 1; opacity: .55; }
.lang-btn svg { width: 22px; height: 11px; display: block; border-radius: 2px;
  outline: 1px solid rgba(0,0,0,.18); outline-offset: -1px; }
.lang-btn:hover { border-color: var(--accent); opacity: .85; }
.lang-btn.active { opacity: 1; color: var(--ink); border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent); cursor: default; }
@media (max-width: 480px) { .lang-btn span { display: none; } }
header.appbar select { flex: 1; min-width: 0; max-width: 320px; }
nav.tabs {
  position: sticky; top: 49px; z-index: 19; background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex; overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
}
nav.tabs .tab {
  border: 0; background: none; padding: 10px 14px; cursor: pointer;
  color: var(--muted); border-bottom: 3px solid transparent; flex: 0 0 auto;
}
nav.tabs .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

main { padding: 12px; max-width: 980px; margin: 0 auto; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 12px;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 9px;
  padding: 8px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-sm { padding: 4px 9px; font-size: 0.85rem; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--card);
  max-width: 100%;
}
input[type="number"] { width: 90px; }
textarea { width: 100%; }
label.inline { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }

.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 0.75rem; color: #fff; vertical-align: middle;
}
.badge.common { background: var(--r-common); }
.badge.rare { background: var(--r-rare); }
.badge.epic { background: var(--r-epic); }
.badge.legendary { background: var(--r-legendary); }
.badge.info { background: var(--accent); }
.badge.plain { background: var(--muted); }

.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
.dot.common { background: var(--r-common); }
.dot.rare { background: var(--r-rare); }
.dot.epic { background: var(--r-epic); }
.dot.legendary { background: var(--r-legendary); }
.item-ico { width: 22px; height: 22px; object-fit: contain; vertical-align: -5px;
  border-radius: 4px; margin-right: 4px; }
.tile-label .item-ico { margin-right: 0; }
/* v3.1.1: іконка, вирізана з картки предмета (коли в каталозі немає icon).
   scale(0.25) зводить квадрат 88px до 22px, translate у масштабованих координатах
   зсуває на відступ 8px — так у віконце потрапляє рівно ігрова іконка. */
.item-ico-card { display: inline-block; position: relative; overflow: hidden;
  border-radius: 4px; background: var(--line); }
.item-ico-card img { position: absolute; top: 0; left: 0; max-width: none;
  transform-origin: 0 0; transform: scale(0.25) translate(-8px, -8px); }

/* v3.1.0: сітка, що читається рядками. Раніше тут були CSS-колонки (masonry) — вони
   рятували від порожнеч між картками різної висоти, але заповнюються згори донизу
   по стовпчиках, через що заданий порядок ярусів (PICKER_ORDER) розповзався між
   колонками. align-items:start лишає кожній плитці натуральну висоту. */
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px; align-items: start; margin-top: 6px; }
.tile { display: block; width: 100%; margin: 0;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  padding: 0; cursor: pointer; overflow: hidden; text-align: center; }
.tile:hover, .tile:focus-visible { border-color: var(--accent); }
/* width:auto — щоб картка не розтягувалася понад натуральний розмір і не пікселила */
.tile img { display: block; width: auto; max-width: 100%; height: auto; margin: 0 auto; }
.tile .tile-label { display: none; padding: 5px 12px; font-size: 0.88rem;
  align-items: center; gap: 6px; }
.tile.no-img .tile-label { display: inline-flex; }

.roster-row { display: flex; gap: 10px; align-items: center; padding: 7px 4px;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.roster-row:last-child { border-bottom: 0; }
.roster-row .nick { min-width: 130px; font-weight: 600; }

/* Ростер вкладки 1: до 4 колонок, згруповано за класами (v1.9) */
.roster-grid { display: grid; grid-template-columns: 1fr; gap: 2px 14px; }
@media (min-width: 620px)  { .roster-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 940px)  { .roster-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1180px) { .roster-grid { grid-template-columns: repeat(4, 1fr); } }
.roster-class-head {
  grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px;
  margin: 12px 0 2px; padding-bottom: 3px; border-bottom: 1px solid var(--line);
  font-weight: 600; letter-spacing: .02em;
}
.roster-class-head:first-child { margin-top: 2px; }
.roster-cell { display: flex; align-items: center; gap: 8px; padding: 3px 2px;
  min-width: 0; flex-wrap: nowrap; }
.roster-cell > label.inline { flex: 1 1 auto; min-width: 0; }   /* нік стискається… */
.roster-cell > .nick { flex: 1 1 auto; min-width: 0; }          /* …і як голий span (вкладка 1) */
.roster-cell .nick { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.roster-cell.dim .nick { color: var(--muted); font-weight: 400; }
.roster-cell .lvl, .roster-cell > label.inline.small {
  flex: 0 0 auto;                                               /* …решта не переноситься */
}
.roster-cell .lvl { font-variant-numeric: tabular-nums; }

.stage-head { font-size: 0.95rem; margin: 14px 0 6px; color: var(--muted);
  border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.stage-head:first-child { margin-top: 0; }
.pos-row { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.pos-row:last-child { border-bottom: 0; }
.pos-row .pos-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cancelled { text-decoration: line-through; opacity: .55; }

@media (max-width: 699px) { header.appbar .brand { display: none; } }

/* Смужка предметів дропу = і список здобичі, і перемикач заявок (v2.1).
   v3.1.1: сітка рівних колонок замість flex-wrap — чипи різної ширини й висоти
   давали рвані ряди («ялинку»). Колонки вирівняні, висота однакова в межах ряду,
   min-height тримає однорядкові назви на висоті дворядкових. */
.item-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 6px; margin: 2px 0 10px; align-items: stretch; }
.item-tab { display: flex; align-items: center; gap: 4px; min-height: 56px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  padding: 4px 8px; font-size: 0.9rem; max-width: 100%; }
.item-tab:hover { border-color: var(--accent); }
.item-tab.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.item-tab .pick { display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  flex: 1 1 auto; text-align: left;
  border: 0; background: none; padding: 2px; margin: 0; cursor: pointer;
  color: inherit; font: inherit; }
/* v3.0.0: назва предмета не обрізається — офіцер мусить бачити, що саме роздає */
/* break-word, а не anywhere: anywhere рве слова посеред складу й псує розрахунок
   ширини — «Поглощающий магию обсидиановый голем» розсипався на чотири рядки */
.item-tab .nm { white-space: normal; overflow-wrap: break-word; text-align: left;
  flex: 1 1 auto; min-width: 0; }
.item-tab .cnt, .item-tab .inpDropQty, .item-tab .del { flex: 0 0 auto; }
/* без цього довга назва чавила іконку у флексі з 22px до 11-13px */
.item-tab .item-ico, .item-tab .dot { flex: 0 0 auto; }
.item-tab .inpDropQty { width: 40px; padding: 3px 4px; }
.item-tab .cnt { min-width: 20px; text-align: center; border-radius: 999px;
  background: var(--line); color: var(--muted); font-size: 0.78rem; padding: 1px 4px;
  font-variant-numeric: tabular-nums; }
.item-tab .cnt.has { background: var(--accent); color: var(--accent-ink); }
.item-tab .del { border: 0; background: none; color: var(--danger); cursor: pointer;
  font-size: 1rem; line-height: 1; padding: 2px 4px; }

/* Панель активного предмета лишається на видноті під час гортання списку гравців */
.claims-head { position: sticky; top: var(--sticky-top, 92px); z-index: 6; background: var(--card);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 -12px 4px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.claims-head .who { font-weight: 600; }

/* Каталог згортається, щойно в дропі щось є */
details.picker { margin-top: 8px; }
details.picker > summary { cursor: pointer; color: var(--accent); font-size: 0.9rem;
  padding: 4px 0; }
details.picker[open] > summary { color: var(--muted); }
details.sect { border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  margin-bottom: 10px; }
details.sect > summary { cursor: pointer; padding: 11px 13px; font-weight: 600; }
details.sect > .sect-body { padding: 0 13px 13px; }
</style>
</head>
<body>
<noscript>Для роботи Loot Manager потрібен увімкнений JavaScript.</noscript>

<div id="banner" hidden><span id="bannerMsg"></span><button id="bannerClose" title="Закрити">×</button></div>

<header class="appbar">
  <span class="brand">🎁 Loot Manager</span>
  <select id="allianceSelect" title="Активний альянс"></select>
  <div id="langSwitch" class="lang-switch" role="group" aria-label="Язык / Language"></div>
  <button id="btnSettings" class="btn" title="Бази та налаштування">⚙️</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="1">1. Подія та вклад</button>
  <button class="tab" data-tab="2">2. Здобич і заявки</button>
  <button class="tab" data-tab="3">3. Розподіл</button>
  <button class="tab" data-tab="4">4. Бази та налаштування</button>
</nav>

<main>
  <section id="tab1"></section>
  <section id="tab2" hidden></section>
  <section id="tab3" hidden></section>
  <section id="tab4" hidden></section>
</main>

<script id="core">
'use strict';
const LMCore = (() => {
  // v4.0.0: від десяти констант лишилось дві. Черга замість балів: бали, клас-бонус,
  // штрафи й ваги рідкості описували те саме «хто давно нічого не брав», але
  // вимагали десяти чисел і не піддавались поясненню в чаті альянсу.
  const DEFAULTS = Object.freeze({
    useTop: true, language: 'ru', discordFormat: 'text'
  });
  const LANGS = Object.freeze(['ru', 'en']);
  const DISCORD_FORMATS = Object.freeze(['text', 'embed']);
  const RARITY_RANK = Object.freeze({ common: 1, rare: 2, epic: 3, legendary: 4 });
  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }
  function defaultSettings() {
    return { ...DEFAULTS };
  }

  // v1.5: реальні класи гри (склад альянсу замовника)
  const CLASS_SEED = [
    ['Маг', 0.8, 0.1, 0.1], ['Воин', 0.3, 0.6, 0.1], ['Жрец', 0.1, 0.1, 0.8],
    ['Разбойник', 0.8, 0.1, 0.1], ['Лучник', 0.8, 0.1, 0.1]
  ];
  // ваги для автостворюваних класів при імпорті складу (за назвою, без регістру)
  const CLASS_WEIGHT_HINTS = {
    'воин': [0.3, 0.6, 0.1], 'жрец': [0.1, 0.1, 0.8],
    'танк': [0.2, 0.7, 0.1], 'лекарь': [0.1, 0.1, 0.8], 'хил': [0.1, 0.1, 0.8]
  };

  // v3.0.0: група розподілу класу — 'A' танки та лекарі, 'B' ДД (усе інше).
  // Реальний процес альянсу: зранку першими обирають A, ввечері — B.
  const GROUP_A_NAMES = Object.freeze(['воин', 'жрец', 'танк', 'лекарь', 'хил']);
  function groupForClassName(name) {
    return GROUP_A_NAMES.includes(String(name || '').trim().toLowerCase()) ? 'A' : 'B';
  }
  // година за місцевим часом клієнта; межа — 15:00
  function defaultFirstGroup(hour) { return Number(hour) < 15 ? 'A' : 'B'; }

  function emptyAllianceData() {
    return { players: [], history: [], eventTypes: [], draftSession: null, lastReport: null };
  }

  function emptyDb(nowISO) {
    const alliance = { id: uuid(), name: 'Мой альянс', createdAt: nowISO, webhookUrl: '' };
    return {
      schemaVersion: 5,
      activeAllianceId: alliance.id,
      settings: defaultSettings(),
      classes: CLASS_SEED.map(([name, wDmg, wTaken, wHeal]) =>
        ({ id: uuid(), name, wDmg, wTaken, wHeal,
           group: groupForClassName(name), isArchived: false })),
      items: [],
      alliances: [alliance],
      perAlliance: { [alliance.id]: emptyAllianceData() }
    };
  }

  function migrate(db) {
    // v1.2: мова лише ru|en; відсутня чи невідома (зокрема стара uk) → ru
    if (db.settings && !LANGS.includes(db.settings.language)) db.settings.language = 'ru';
    if (db.schemaVersion === 1) {
      // v3.0.0: класи дістають групу розподілу за назвою
      for (const c of db.classes || []) {
        if (c.group !== 'A' && c.group !== 'B') c.group = groupForClassName(c.name);
      }
      // чернетка сеансу: присутності й метрик розширеного режиму більше не існує
      for (const paData of Object.values(db.perAlliance || {})) {
        const d = paData.draftSession;
        if (!d) continue;
        delete d.mode;
        for (const pid of Object.keys(d.presence || {})) {
          d.presence[pid] = { top: !!d.presence[pid].top };
        }
        if (d.firstGroup !== 'A' && d.firstGroup !== 'B') d.firstGroup = 'A';
      }
      db.schemaVersion = 2;
    }
    if (db.schemaVersion === 2) {
      // v4.0.0: черга замість балів — старі константи алгоритму більше ні на що
      // не впливають, лишаємо тільки вікно історії й прапорець ТОП
      const old = db.settings || {};
      db.settings = {
        historyDays: Number(old.historyDays) > 0 ? Number(old.historyDays) : 14,
        useTop: old.useTop !== false,
        webhookUrl: old.webhookUrl || '',
        language: LANGS.includes(old.language) ? old.language : 'ru'
      };
      db.schemaVersion = 3;
    }
    if (db.schemaVersion === 3) {
      // v4.2.0: вікно в днях зникло — черга крутиться за датою останнього отримання
      const s3 = db.settings || {};
      db.settings = { useTop: s3.useTop !== false, webhookUrl: s3.webhookUrl || '',
        language: LANGS.includes(s3.language) ? s3.language : 'ru' };
      db.schemaVersion = 4;
    }
    if (db.schemaVersion === 4) {
      // v5.0.0 (Етап 2): адреса вебхука переїжджає з глобальних налаштувань в альянс.
      // Канал у кожного альянсу свій: глобальне поле означало б, що після перемикання
      // альянсу звіт іде чужим людям — помилку видно вже після відправки.
      const s4 = db.settings || {};
      const legacy = typeof s4.webhookUrl === 'string' ? s4.webhookUrl : '';
      for (const a of db.alliances || []) {
        if (typeof a.webhookUrl !== 'string') a.webhookUrl = legacy;
      }
      for (const paData of Object.values(db.perAlliance || {})) {
        if (paData.lastReport === undefined) paData.lastReport = null;
        for (const p of paData.players || []) {
          if (p.discordId === undefined) p.discordId = null;
        }
      }
      db.settings = {
        useTop: s4.useTop !== false,
        language: LANGS.includes(s4.language) ? s4.language : 'ru',
        discordFormat: DISCORD_FORMATS.includes(s4.discordFormat) ? s4.discordFormat : 'text'
      };
      db.schemaVersion = 5;
    }
    if (db.schemaVersion === 5) return { ok: true, db };
    return { ok: false, error: 'Непідтримувана версія схеми: ' + db.schemaVersion };
  }

  function validateImport(raw) {
    const fail = (error) => ({ ok: false, error });
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      return fail('очікується JSON-об\'єкт бази');
    }
    if (typeof raw.schemaVersion !== 'number') return fail('відсутній schemaVersion');
    if (!Array.isArray(raw.alliances) || raw.alliances.length === 0) {
      return fail('список альянсів порожній або відсутній');
    }
    if (raw.alliances.some(a => !a || typeof a.id !== 'string' || typeof a.name !== 'string')) {
      return fail('запис альянсу без id або name');
    }
    if (!raw.alliances.some(a => a.id === raw.activeAllianceId)) {
      return fail('activeAllianceId не вказує на жоден альянс');
    }
    if (!raw.settings || typeof raw.settings !== 'object') return fail('відсутні settings');
    if (!Array.isArray(raw.classes)) return fail('відсутній довідник класів');
    if (!Array.isArray(raw.items)) return fail('відсутній каталог предметів');
    if (!raw.perAlliance || typeof raw.perAlliance !== 'object') {
      return fail('відсутній блок perAlliance');
    }
    for (const a of raw.alliances) {
      const pa = raw.perAlliance[a.id];
      if (!pa || !Array.isArray(pa.players) || !Array.isArray(pa.history) ||
          !Array.isArray(pa.eventTypes)) {
        return fail('немає даних perAlliance для альянсу «' + a.name + '»');
      }
    }
    return migrate(raw);
  }

  // Адреса вебхука — фактично пароль на запис у канал, а файл бекапу пересилають.
  // У знімок вона не потрапляє; discordId гравців не секрет і лишається як є.
  function exportSnapshot(db) {
    const copy = JSON.parse(JSON.stringify(db));
    for (const a of copy.alliances || []) a.webhookUrl = '';
    return copy;
  }
  // Порожнє поле у файлі означає «не задано», а не «очистити»: імпорт не повинен
  // забирати робочу адресу. Зіставлення за id альянсу.
  function keepLocalWebhooks(incoming, current) {
    const local = new Map((current.alliances || []).map(a => [a.id, a.webhookUrl || '']));
    for (const a of incoming.alliances || []) {
      if (!a.webhookUrl) a.webhookUrl = local.get(a.id) || '';
    }
    return incoming;
  }

  // v4.0.0: балів більше немає — черга будується за кількістю вже отриманого.
  // Позначка ТОП лишилась як тай-брейк серед рівних (settings.useTop).
  function isTopFlag(session, settings, pid) {
    const presence = (session && session.presence) || {};
    return settings.useTop !== false && !!(presence[pid] && presence[pid].top);
  }

  // ТЗ §5.2 (v4.2.0): коли гравець востаннє щось отримував; null — не отримував ніколи.
  // Вікна в днях більше немає: черга крутиться сама, бо взяте одразу відсуває в кінець.
  function lastReceivedAt(history, playerId) {
    let last = null;
    for (const r of history) {
      if (r.playerId !== playerId || r.cancelled) continue;
      const t = Date.parse(r.timestamp);
      if (!Number.isNaN(t) && (last === null || t > last)) last = t;
    }
    return last;
  }

  // ТЗ §5.3–5.7: черга пріоритетів; overrides — ручні рішення, rollMemo — стабільність ролів
  function distribute(ctx) {
    const { session, playersById, classesById, itemsById, history, settings,
            nowISO, overrides, rollMemo } = ctx;
    const rng = ctx.rng || Math.random;
    const eligibleIds = Object.keys(playersById)
      .filter(pid => playersById[pid].isActive !== false);   // вибулі не в черзі
    const histCache = new Map();
    const lastOf = pid => {
      if (!histCache.has(pid)) histCache.set(pid, lastReceivedAt(history, pid));
      return histCache.get(pid);
    };
    const nowMs = Date.parse(nowISO);
    // Ключ черги: чим менший, тим раніше обирає. Хто не отримував ніколи — попереду
    // всіх; хто вже взяв у цьому івенті — позаду всіх, у порядку своїх виграшів.
    const queueAt = pid => {
      if (wonSeq[pid] !== undefined) return nowMs + 1 + wonSeq[pid];
      const last = lastOf(pid);
      return last === null ? -Infinity : last;
    };
    const topOf = pid => isTopFlag(session, settings, pid);
    const drops = (session.drops || [])
      .map((d, idx) => ({ ...d, idx,
        rank: (itemsById[d.itemId] && RARITY_RANK[itemsById[d.itemId].rarity]) || 0 }))
      .sort((a, b) => b.rank - a.rank || a.idx - b.idx);
    // v3.0.0: порядок етапів задає офіцер у чернетці сеансу (ранок / вечір)
    // v4.3.0: 'ALL' — без поділу на етапи, уся здобич розігрується одним проходом
    const single = session.firstGroup === 'ALL';
    const firstGroup = session.firstGroup === 'B' ? 'B' : 'A';
    const groupOf = pid => {
      const p = playersById[pid];
      const c = p && classesById[p.classId];
      return c && c.group === 'A' ? 'A' : 'B';
    };
    const stageOf = pid => (single || groupOf(pid) === firstGroup) ? 1 : 2;

    const wonSeq = {};     // pid → порядок його виграшу в цьому івенті (відсуває в кінець)
    const wonItem = {};    // pid → Set(itemId): правило «одна штука предмета на гравця»
    let seq = 0;
    const take = (itemId, pid) => {
      wonSeq[pid] = seq++;
      (wonItem[pid] = wonItem[pid] || new Set()).add(itemId);
    };

    // усі штуки здобичі одним пласким списком — порядок звіту не залежить від етапів
    const slots = [];
    for (const d of drops) {
      const item = itemsById[d.itemId];
      if (!item) continue;
      const qty = Math.max(1, Number(d.quantity) || 1);
      for (let copy = 0; copy < qty; copy++) {
        slots.push({ key: d.itemId + '#' + copy, itemId: d.itemId, copyIndex: copy, item,
          winnerId: null, lastAt: null, top: false, rolled: false, manual: false,
          candidates: [] });
      }
    }

    // претенденти на штуку; stage === null — без фільтра за групою (для ручних рішень).
    // v4.1.0: спершу ТОПи (хто тягнув івент), усередині кожної групи — черга, далі рол.
    // До v4.1.0 черга стояла попереду ТОПа, і при двох івентах на день позначка майже
    // не спрацьовувала. v4.2.0: черга — за датою останнього отримання, без вікна в днях.
    const claimantsFor = (slot, stage) => eligibleIds
      .filter(pid => stage === null || stageOf(pid) === stage)
      .filter(pid => Array.isArray(session.claims && session.claims[pid]) &&
                     session.claims[pid].includes(slot.itemId))
      .filter(pid => !(wonItem[pid] && wonItem[pid].has(slot.itemId)))
      .map(pid => ({ playerId: pid, at: queueAt(pid), top: topOf(pid),
        lastAt: lastOf(pid) === null ? null : new Date(lastOf(pid)).toISOString() }))
      .sort((a, b) => (b.top ? 1 : 0) - (a.top ? 1 : 0) || a.at - b.at);

    // ТЗ §5.7 крок 0: ручні рішення офіцера — поза чергою етапів і поза обмеженнями
    for (const slot of slots) {
      const manualWinner = overrides && overrides[slot.key];
      if (!manualWinner || !playersById[manualWinner] ||
          playersById[manualWinner].isActive === false) continue;
      slot.candidates = claimantsFor(slot, null);
      slot.winnerId = manualWinner; slot.manual = true;
      slot.top = topOf(manualWinner);
      slot.lastAt = lastOf(manualWinner) === null
        ? null : new Date(lastOf(manualWinner)).toISOString();
      take(slot.itemId, manualWinner);
    }

    // ТЗ §5.7 кроки 1-2: етап першої групи по всій здобичі, далі друга група по залишках.
    // У режимі «усі разом» прохід один, без фільтра за групою класу (stage === null).
    for (const stage of (single ? [null] : [1, 2])) {
      for (const slot of slots) {
        if (slot.winnerId) continue;
        const cands = claimantsFor(slot, stage);
        slot.candidates = cands;
        if (cands.length === 0) continue;
        const best = cands[0];
        const leaders = cands.filter(c => c.at === best.at && c.top === best.top);
        let chosen = leaders[0];
        if (leaders.length > 1) {
          slot.rolled = true;
          const memoWinner = rollMemo && rollMemo[slot.key];
          chosen = (memoWinner && leaders.some(l => l.playerId === memoWinner))
            ? leaders.find(l => l.playerId === memoWinner)
            : leaders[Math.floor(rng() * leaders.length)];
        }
        slot.winnerId = chosen.playerId; slot.lastAt = chosen.lastAt; slot.top = chosen.top;
        take(slot.itemId, chosen.playerId);
      }
    }

    const positions = slots.map(s => ({
      key: s.key, itemId: s.itemId, copyIndex: s.copyIndex,
      winnerId: s.winnerId, lastAt: s.lastAt, top: s.top,
      rolled: s.rolled, manual: s.manual,
      stage: s.winnerId ? stageOf(s.winnerId) : (single ? 1 : 2),
      candidates: s.candidates
    }));
    return { positions };
  }

  // v1.8: база вважається незайманою, поки користувач не вніс жодних власних даних —
  // тільки такій базі дозволено автозасів (див. bootstrapSeed в #app)
  function isPristine(db) {
    if (!db || db.alliances.length !== 1 || db.items.length > 0) return false;
    return Object.values(db.perAlliance).every(pa =>
      pa.players.length === 0 && pa.history.length === 0 && pa.eventTypes.length === 0);
  }

  // v1.5: імпорт складу альянсу з тексту гри
  // Формат: заголовок класу (можливо з емодзі) + рядки «N. Нік — Ур. LVL»
  function parseRoster(text) {
    const lines = String(text || '').split(/\r?\n/);
    const playerRe = /^\s*\d+[.)]\s*(.+?)\s*[—–-]+\s*Ур\.?\s*(\d+)\s*$/u;
    const groups = [];
    let current = null;
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(playerRe);
      if (m) {
        if (!current) {
          return { ok: false, error: 'гравець до першого заголовка класу: «' + line + '»' };
        }
        current.players.push({ nickname: m[1].trim(), level: Number(m[2]) });
      } else {
        const className = line.replace(/^[^\p{L}]+/u, '').trim();
        if (!className) continue;                    // рядок із самих емодзі/розділювачів
        current = { className, players: [] };
        groups.push(current);
      }
    }
    const total = groups.reduce((s, g) => s + g.players.length, 0);
    if (total === 0) return { ok: false, error: 'не розпізнано жодного гравця' };
    return { ok: true, groups: groups.filter(g => g.players.length > 0) };
  }

  // Upsert гравців за ніком (без регістру) і класів за назвою; нічого не видаляє,
  // роль та isActive наявних гравців не чіпає.
  // opts.replaceRoster (v3.2.0): список із гри — джерело правди. Хто в ньому є —
  // активний, кого немає — вибув (isActive = false). Гравці не видаляються: на них
  // посилається історія, а роль офіцер проставляв руками.
  function applyRoster(players, classes, groups, nowISO, opts) {
    let addedPlayers = 0, updatedPlayers = 0, addedClasses = 0, deactivated = 0;
    const inList = new Set();
    for (const g of groups) {
      for (const rp of g.players) inList.add(rp.nickname.trim().toLowerCase());
    }
    for (const g of groups) {
      let cls = classes.find(c => c.name.toLowerCase() === g.className.toLowerCase());
      if (!cls) {
        const w = CLASS_WEIGHT_HINTS[g.className.toLowerCase()] || [0.8, 0.1, 0.1];
        cls = { id: uuid(), name: g.className, wDmg: w[0], wTaken: w[1], wHeal: w[2],
          group: groupForClassName(g.className), isArchived: false };
        classes.push(cls); addedClasses++;
      }
      for (const rp of g.players) {
        const existing = players.find(p =>
          p.nickname.toLowerCase() === rp.nickname.toLowerCase());
        if (existing) {
          existing.classId = cls.id; existing.level = rp.level; updatedPlayers++;
          if (opts && opts.replaceRoster) existing.isActive = true;   // повернувся у склад
        } else {
          players.push({ id: uuid(), nickname: rp.nickname, classId: cls.id,
            role: 'Учасник', isActive: true, level: rp.level, createdAt: nowISO });
          addedPlayers++;
        }
      }
    }
    if (opts && opts.replaceRoster) {
      for (const p of players) {
        if (p.isActive !== false && !inList.has(p.nickname.trim().toLowerCase())) {
          p.isActive = false; deactivated++;
        }
      }
    }
    return { addedPlayers, updatedPlayers, addedClasses, deactivated };
  }

  // Discord ID — 17–20 цифр (snowflake). Рядок «Нік = 123…»; дефіс роздільником не
  // беремо: він трапляється всередині ніків.
  const DISCORD_ID_RE = /^\d{17,20}$/;
  function parseDiscordIds(text) {
    const pairs = [], bad = [];
    for (const raw of String(text == null ? '' : text).split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(/^(.+?)\s*(?:=|—|:|\t)\s*(\S+)$/);
      if (!m || !DISCORD_ID_RE.test(m[2])) { bad.push(line); continue; }
      pairs.push({ nickname: m[1].trim(), discordId: m[2] });
    }
    return { pairs, bad };
  }
  function applyDiscordIds(players, pairs) {
    let updated = 0; const unknown = [];
    for (const pr of pairs) {
      const p = players.find(x =>
        x.nickname.trim().toLowerCase() === pr.nickname.trim().toLowerCase());
      if (!p) { unknown.push(pr.nickname); continue; }
      p.discordId = pr.discordId; updated++;
    }
    return { updated, unknown };
  }

  // v1.4: інтеграція з каталогом предметів (data/loot.json інструмента вилучення зображень)
  function mapCatalogRarity(n) {
    if (n >= 4) return 'legendary';
    if (n === 3) return 'epic';
    if (n === 2) return 'rare';
    return 'common';
  }
  function validateCatalog(raw) {
    if (!Array.isArray(raw)) return { ok: false, error: 'очікується масив каталогу' };
    for (const e of raw) {
      if (!e || typeof e.uid !== 'number' || typeof e.ru !== 'string' || !e.ru) {
        return { ok: false, error: 'запис каталогу без uid або ru-назви' };
      }
    }
    return { ok: true };
  }
  // Upsert у items: за catalogUid; ручні предмети з тією ж назвою усиновлюються, не дублюються.
  // Нічого не видаляє; повертає {added, updated}.
  function syncCatalog(items, catalog) {
    let added = 0, updated = 0;
    for (const c of catalog) {
      let item = items.find(i => i.catalogUid === c.uid);
      if (!item) {
        item = items.find(i => (i.catalogUid === undefined || i.catalogUid === null) &&
          i.name.toLowerCase() === c.ru.toLowerCase());
      }
      const fields = {
        catalogUid: c.uid, name: c.ru, nameEn: c.en || '', icon: c.icon || '',
        rarity: mapCatalogRarity(c.rarity),
        rarityLabelRu: c.rarity_ru || '', rarityLabelEn: c.rarity_en || ''
      };
      if (item) { Object.assign(item, fields); updated++; }
      else {
        items.push(Object.assign({ id: uuid(), category: 'Інше', targetClasses: [],
          isArchived: false }, fields));
        added++;
      }
    }
    return { added, updated };
  }

  // ТЗ §6: «ТОП Вклад» у звіті — прапорець офіцера (якщо він увімкнений у налаштуваннях)
  function topContributors(session, playerIds, settings) {
    return new Set(playerIds.filter(pid => isTopFlag(session, settings, pid)));
  }

  // v1.2: фіксовані рядки звіту — російська (дефолт) та англійська
  const REPORT_I18N = Object.freeze({
    ru: { header: (a, e) => '📜 [АЛЬЯНС: ' + a + '] РАСПРЕДЕЛЕНИЕ ДОБЫЧИ (' + e + ')',
          pcs: 'шт.', top: 'TOP', free: '[Свободный остаток]',
          stage: (n, who) => '▸ ЭТАП ' + n + ' — ' + who,
          groupA: 'Танки и лекари', groupB: 'ДД',
          footer: 'Спасибо всем за участие! Предметы ждут в магазине альянса.' },
    en: { header: (a, e) => '📜 [ALLIANCE: ' + a + '] LOOT DISTRIBUTION (' + e + ')',
          pcs: 'pcs', top: 'TOP', free: '[Unclaimed]',
          stage: (n, who) => '▸ STAGE ' + n + ' — ' + who,
          groupA: 'Tanks & healers', groupB: 'DPS',
          footer: 'Thanks everyone for participating! Items are waiting in the alliance shop.' }
  });

  // v5.0.0: рядки повідомлень Discord. Правила ті самі, що в §6: фіксований текст —
  // мовою інтерфейсу, дані користувача — як введені.
  const DISCORD_I18N = Object.freeze({
    ru: { announce: (a, e) => '📢 [АЛЬЯНС: ' + a + '] СБОР ЗАЯВОК (' + e + ')',
          remind: (a, e) => '⏳ [АЛЬЯНС: ' + a + '] НАПОМИНАНИЕ О ЗАЯВКАХ (' + e + ')',
          pcs: 'шт.', claims: n => 'заявок: ' + n,
          notYet: (n, list) => 'Ещё не подали (' + n + '): ' + list,
          contd: '(продолжение)',
          announceFooter: 'Подавайте заявки офицеру.' },
    en: { announce: (a, e) => '📢 [ALLIANCE: ' + a + '] CLAIMS OPEN (' + e + ')',
          remind: (a, e) => '⏳ [ALLIANCE: ' + a + '] CLAIMS REMINDER (' + e + ')',
          pcs: 'pcs', claims: n => 'claims: ' + n,
          notYet: (n, list) => 'Not claimed yet (' + n + '): ' + list,
          contd: '(continued)',
          announceFooter: 'Send your claims to the officer.' }
  });

  // v3.0.0: у чат ідуть обидві назви предмета — мовою інтерфейсу першою, далі друга через «/».
  // Гравці сидять у клієнтах різних мов, і одна назва не дає їм зрозуміти, про що йдеться.
  function itemNamesForChat(item, lang) {
    if (!item) return '?';
    const ru = item.name || '';
    const en = item.nameEn || '';
    const primary = (lang === 'en' && en) ? en : ru;
    const other = (lang === 'en' && en) ? ru : en;
    if (!other || other === primary) return primary || other || '?';
    return primary + ' / ' + other;
  }

  /* ===== Discord (ТЗ §2.2, Етап 2) ===== */
  // Суворий формат адреси: інакше застосунок міг би тихо відправити склад альянсу
  // на чужий хост, якби адресу підмінили в імпортованому бекапі.
  const WEBHOOK_RE = /^https:\/\/(?:discord|discordapp)\.com\/api\/(?:v\d+\/)?webhooks\/\d+\/[\w-]+$/;
  function isWebhookUrl(url) { return WEBHOOK_RE.test(String(url == null ? '' : url).trim()); }

  const DISCORD_LIMIT = 2000;
  // Ліміт Discord — 2000 символів на повідомлення. Ріжемо по межах рядків: розрив
  // усередині рядка звіту робить його нечитабельним.
  function splitForDiscord(text, limit) {
    const max = Number(limit) > 0 ? Number(limit) : DISCORD_LIMIT;
    const src = String(text == null ? '' : text);
    if (src.trim() === '') return [];
    const out = [];
    let buf = '';
    const flush = () => { if (buf !== '') { out.push(buf); buf = ''; } };
    for (const rawLine of src.split('\n')) {
      let line = rawLine;
      while (line.length > max) {          // патологія: один рядок довший за ліміт
        flush();
        out.push(line.slice(0, max));
        line = line.slice(max);
      }
      const candidate = buf === '' ? line : buf + '\n' + line;
      if (candidate.length > max) { flush(); buf = line; }
      else buf = candidate;
    }
    flush();
    return out;
  }

  // ТЗ §6 (v3.0.0): дві секції етапів; рядок на предмет усередині секції;
  // кілька вільних штук — одна позначка; 🎲/manual у текст не виводяться
  function formatReport({ allianceName, eventTypeName, positions, itemsById,
                          playersById, classesById, topSet, lang, firstGroup,
                          mentionsById }) {
    const L = REPORT_I18N[lang] || REPORT_I18N.ru;
    const single = firstGroup === 'ALL';
    const first = firstGroup === 'B' ? 'B' : 'A';
    const groupName = g => (g === 'A' ? L.groupA : L.groupB);
    const linesFor = stage => {
      const byItem = [];       // порядок першої появи предмета в межах етапу
      const groups = new Map();
      for (const pos of positions) {
        if ((pos.stage === 1 ? 1 : 2) !== stage) continue;
        if (!groups.has(pos.itemId)) { groups.set(pos.itemId, []); byItem.push(pos.itemId); }
        groups.get(pos.itemId).push(pos);
      }
      const out = [];
      for (const itemId of byItem) {
        const item = itemsById[itemId];
        const posList = groups.get(itemId);
        // v4.4.0: нумерований список ніків без класу; [TOP] — якщо предмет пішов
        // гравцю як позначеному ТОП. Клас офіцеру в чаті не потрібен — його видно в грі.
        const entries = [];
        let freeCount = 0;
        for (const pos of posList) {
          if (!pos.winnerId) { freeCount++; continue; }
          const player = playersById[pos.winnerId];
          const nick = player ? player.nickname : '?';
          // v5.0.0: у Discord замість ніка йде згадка — гравець отримує сповіщення.
          // В ігровий чат mentionsById не передається: гра згадок не резолвить.
          const mention = mentionsById && player ? mentionsById[player.id] : null;
          const shown = mention ? '<@' + mention + '>' : nick;
          const topMark = topSet.has(pos.winnerId) ? ' [' + L.top + ']' : '';
          entries.push((entries.length + 1) + '. ' + shown + topMark);
        }
        const displayName = itemNamesForChat(item, lang);
        out.push('🔹 ' + displayName + ' (' + posList.length + ' ' + L.pcs + ') — ' +
          entries.join(' ') + (freeCount > 0 ? (entries.length ? ', ' : '') + L.free : ''));
      }
      return out;
    };
    const blocks = [];
    if (single) {                      // без поділу на етапи — суцільний список
      const lines = linesFor(1);
      if (lines.length > 0) blocks.push(lines.join('\n'));
    } else {
      for (const stage of [1, 2]) {
        const lines = linesFor(stage);
        if (lines.length === 0) continue;
        const g = stage === 1 ? first : (first === 'A' ? 'B' : 'A');
        blocks.push(L.stage(stage, groupName(g)) + '\n' + lines.join('\n'));
      }
    }
    return L.header(allianceName, eventTypeName) + '\n\n' +
      blocks.join('\n\n') + '\n\n' + L.footer;
  }

  // Готові тіла запитів до вебхука. Розбиття живе тут, тож транспорт про ліміти
  // не знає. parse: [] знешкоджує @everyone/@here і ролі, навіть якщо вони
  // потрапили в нік або назву івенту.
  const EMBED_COLOR = Object.freeze({ announce: 0x5865f2, remind: 0xfaa61a, report: 0x57f287 });
  const EMBED_LIMIT = 4096;
  // Мініатюра — іконка найріднішого предмета; порожній icon підміняється карткою з
  // гри (обидві теки публікує deploy.sh). Локальні шляхи Discord не дістане, тому
  // адреса лише абсолютна.
  function embedThumb(items, lang, iconBase) {
    if (!iconBase || !items || items.length === 0) return null;
    const best = items.slice().sort((a, b) =>
      (RARITY_RANK[b.rarity] || 0) - (RARITY_RANK[a.rarity] || 0))[0];
    if (!best) return null;
    if (best.icon) return iconBase + best.icon;
    if (best.catalogUid) return iconBase + 'cards/' + best.catalogUid + '_' + lang + '.jpg';
    return null;
  }
  // Пінги всередині embed Discord не надсилає — сповіщення йдуть лише з content.
  // Тому картка завжди без згадок; про це попереджає підказка у вкладці 4.
  function embedPayloads(kind, title, body, lang, thumbUrl) {
    const L = DISCORD_I18N[lang] || DISCORD_I18N.ru;
    return splitForDiscord(body, EMBED_LIMIT).map((description, i) => ({
      content: '',
      embeds: [Object.assign(
        { title: i === 0 ? title : title + ' ' + L.contd,
          description, color: EMBED_COLOR[kind] },
        i === 0 && thumbUrl ? { thumbnail: { url: thumbUrl } } : {})],
      allowed_mentions: { parse: [], users: [] }
    }));
  }

  function buildReportPayloads({ format, lang, title, text, plainText, mentionIds,
                                 items, iconBase }) {
    if (format === 'embed') {
      // Discord не рендерить згадки всередині embed: `<@id>` пішов би в канал сирою
      // розміткою. Тому картка друкує ніки — версію без підстановки.
      return embedPayloads('report', title || '', plainText != null ? plainText : text, lang,
        embedThumb(items || [], lang, iconBase));
    }
    const users = [...new Set((mentionIds || []).filter(Boolean).map(String))];
    return splitForDiscord(text).map(content =>
      ({ content, allowed_mentions: { parse: [], users } }));
  }

  function plainPayloads(text) {
    return splitForDiscord(text).map(content =>
      ({ content, allowed_mentions: { parse: [], users: [] } }));
  }
  function buildAnnouncePayloads({ format, lang, allianceName, eventTypeName, drops,
                                   itemsById, iconBase }) {
    if (!drops || drops.length === 0) return [];
    const L = DISCORD_I18N[lang] || DISCORD_I18N.ru;
    const lines = drops.map(dr => '🔹 ' + itemNamesForChat(itemsById[dr.itemId], lang) +
      ' — ' + dr.quantity + ' ' + L.pcs);
    const head = L.announce(allianceName, eventTypeName);
    const body = lines.join('\n') + '\n\n' + L.announceFooter;
    if (format === 'embed') {
      return embedPayloads('announce', head, body, lang,
        embedThumb(drops.map(dr => itemsById[dr.itemId]).filter(Boolean), lang, iconBase));
    }
    return plainPayloads(head + '\n\n' + body);
  }
  // Нагадування нікого не пінгує: застосунок не знає, хто зараз онлайн, і адресний
  // тичок усьому складу — шум, а не користь.
  function buildRemindPayloads({ format, lang, allianceName, eventTypeName, drops, claims,
                                 players, itemsById, iconBase }) {
    if (!drops || drops.length === 0) return [];
    const L = DISCORD_I18N[lang] || DISCORD_I18N.ru;
    const cl = claims || {};
    const lines = drops.map(dr => {
      const n = Object.keys(cl).filter(pid => (cl[pid] || []).includes(dr.itemId)).length;
      return '🔹 ' + itemNamesForChat(itemsById[dr.itemId], lang) + ' — ' +
        dr.quantity + ' ' + L.pcs + ', ' + L.claims(n);
    });
    const silent = (players || [])
      .filter(p => p.isActive !== false && !(cl[p.id] && cl[p.id].length))
      .map(p => p.nickname);
    const tail = silent.length ? '\n\n' + L.notYet(silent.length, silent.join(', ')) : '';
    const head = L.remind(allianceName, eventTypeName);
    const body = lines.join('\n') + tail;
    if (format === 'embed') {
      return embedPayloads('remind', head, body, lang,
        embedThumb(drops.map(dr => itemsById[dr.itemId]).filter(Boolean), lang, iconBase));
    }
    return plainPayloads(head + '\n\n' + body);
  }

  // ТЗ §5.8, §3.3: групування позицій у записи історії зі снапшотами
  function buildRecords({ positions, itemsById, playersById, nowISO, eventTypeName }) {
    const grouped = new Map();   // "pid|itemId" → {quantity, rolled, manual}
    for (const pos of positions) {
      if (!pos.winnerId) continue;
      const k = pos.winnerId + '|' + pos.itemId;
      const g = grouped.get(k) || { playerId: pos.winnerId, itemId: pos.itemId,
        quantity: 0, rolled: false, manual: false };
      g.quantity += 1;
      g.rolled = g.rolled || pos.rolled;
      g.manual = g.manual || pos.manual;
      grouped.set(k, g);
    }
    return [...grouped.values()].map(g => ({
      id: uuid(),
      timestamp: nowISO,
      eventTypeName,
      itemId: g.itemId,
      itemNameSnapshot: itemsById[g.itemId] ? itemsById[g.itemId].name : '?',
      playerId: g.playerId,
      playerNicknameSnapshot: playersById[g.playerId] ? playersById[g.playerId].nickname : '?',
      quantity: g.quantity,
      rolled: g.rolled,
      manual: g.manual,
      cancelled: false
    }));
  }

  return { DEFAULTS, RARITY_RANK, uuid, defaultSettings, emptyDb, migrate, validateImport,
           exportSnapshot, keepLocalWebhooks, isWebhookUrl, splitForDiscord,
           buildReportPayloads, buildAnnouncePayloads, buildRemindPayloads,
           lastReceivedAt, distribute, topContributors, formatReport,
           buildRecords, mapCatalogRarity, validateCatalog, syncCatalog,
           parseRoster, applyRoster, isPristine, parseDiscordIds, applyDiscordIds,
           groupForClassName, defaultFirstGroup };
})();
</script>

function banner(msg) {
  const el = document.getElementById('banner');
  document.getElementById('bannerMsg').textContent = msg;
  el.hidden = false;
  clearTimeout(banner._t);
  banner._t = setTimeout(() => { el.hidden = true; }, 6000);

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { banner(t('lsUnavailable', e.message)); }
  if (!raw) return LMCore.emptyDb(nowISO());
  try {
    const parsed = JSON.parse(raw);
    const mig = LMCore.migrate(parsed);
    if (!mig.ok) { banner(t('dbNotLoaded', mig.error)); return LMCore.emptyDb(nowISO()); }
    return mig.db;
  } catch (e) {
    banner(t('dbCorrupt', e.message));
    return LMCore.emptyDb(nowISO());
  }
}

function rosterGridHtml(d, visible) {
  const groups = new Map();
  for (const p of visible) {
    if (!groups.has(p.classId)) groups.set(p.classId, []);
    groups.get(p.classId).push(p);
  }
  const order = db.classes.map(c => c.id).filter(id => groups.has(id));
  for (const id of groups.keys()) if (!order.includes(id)) order.push(id);

  const cell = p => {
    const isTop = !!(d.presence[p.id] && d.presence[p.id].top);
    return '<div class="roster-cell' + (isTop ? '' : ' dim') + '">' +
      '<span class="nick">' + escapeHtml(p.nickname) + '</span>' +
      (p.level ? '<span class="muted small lvl">' + p.level + '</span>' : '') +
      '<label class="inline small" title="' + t('topFlag') + '">' +
        '<input type="checkbox" class="chkTop" data-pid="' + p.id + '"' +
        (isTop ? ' checked' : '') + '> ' + t('topFlag') + '</label>' +
    '</div>';
  };

  return '<div class="roster-grid">' +
    order.map(cid => {
      const list = groups.get(cid);
      const tops = list.filter(p => d.presence[p.id] && d.presence[p.id].top).length;
      return '<div class="roster-class-head">' + escapeHtml(className(cid)) +
        '<span class="muted small">' + t('topCount') + ' ' + tops + '/' + list.length +
        '</span></div>' + list.map(cell).join('');
    }).join('') + '</div>';
}

// v3.1.0: ручний порядок плиток у пікері (числа — catalogUid).
// Чому не за рідкістю: каталог ставить УСІМ істотам rarity 4 «Уник.» — і фіолетовим
// унікальним, і синім оркам, — а всім скриням rarity 3 «Эпич.». Тобто справжніх
// ігрових ярусів у даних немає, порядок заданий офіцером за скріншотами з гри.
// Предмет, якого тут немає (створений вручну чи новий у каталозі), йде в кінець.
const PICKER_ORDER = [
  1, 7, 2, 8,       // фіолетові унікальні
  3, 4, 5, 6,       // прості фіолетові
  9, 10, 11, 12,    // сині
  15, 14, 13        // скрині: III → II → I
];
function pickerRank(item) {
  const i = item.catalogUid ? PICKER_ORDER.indexOf(item.catalogUid) : -1;
  return i < 0 ? PICKER_ORDER.length : i;
}

// v1.6: плитковий пікер — картки предметів (cards/<uid>_<мова>.jpg) або чип-фолбек
function quickPickHtml(filter) {
  const f = (filter || '').trim().toLowerCase();
  const pool = db.items.filter(i => !i.isArchived &&
    (!f || i.name.toLowerCase().includes(f) ||
     (i.nameEn && i.nameEn.toLowerCase().includes(f))))
    .sort((a, b) => pickerRank(a) - pickerRank(b));   // стабільне: решта — в порядку каталогу
  if (db.items.filter(i => !i.isArchived).length === 0) return '';
  const shown = pool.slice(0, 24);
  const tiles = shown.map(i => {
    const label = '<span class="tile-label">' +
      (itemIcon(i) || '<span class="dot ' + i.rarity + '"></span>') +
      escapeHtml(itemDisplayName(i)) + '</span>';
    const img = i.catalogUid
      ? '<img src="cards/' + i.catalogUid + '_' + lang() + '.jpg" alt="' +
        escapeHtml(itemDisplayName(i)) + '" loading="lazy" ' +
        'onerror="this.parentNode.classList.add(\'no-img\'); this.remove()">'
      : '';
    return '<button type="button" class="tile' + (img ? '' : ' no-img') + '" data-iid="' +
      i.id + '" title="' + escapeHtml(itemDisplayName(i)) + '">' + img + label + '</button>';
  }).join('');
  return '<span class="muted small">' + t('quickPick') + '</span>' +
    '<div class="tile-grid">' + tiles + '</div>' +
    (pool.length > shown.length
      ? '<div class="muted small" style="margin-top:4px">' +
        t('moreItems', pool.length - shown.length) + '</div>' : '');
}

function renderTab2() {
  const d = draft();
  const itemsById = byId(db.items);
  // v3.2.1: каталог більше не згортається сам при появі предмета в дропі —
  // офіцер додає здобич пачками, і кожне автозгортання коштувало зайвого кліка.
  // Закритий лише тоді, коли його закрили кліком по заголовку.
  const pickerOpen = ui.pickerOpen !== false;

  const dropItems = d.drops.map(dr => itemsById[dr.itemId]).filter(Boolean);
  // ТЗ §4.3 (v1.3): заявки доступні всім активним; галочка сама позначає присутність
  const allClaimants = pa().players.filter(p => p.isActive);
  const claimants = allClaimants.filter(classFilterMatch);   // v1.7: фільтр за класом
  let claimsHtml;
  if (allClaimants.length === 0) {
    claimsHtml = '<p class="muted">' + t('noPlayers') + '</p>';
  } else if (dropItems.length === 0) {
    claimsHtml = '<p class="muted">' + t('addLootFirst') + '</p>';
  } else if (claimants.length === 0) {
    claimsHtml = classFilterBar() + '<p class="muted">' + t('filterEmpty') + '</p>';
  } else {
    // v2.1: смужка предметів — водночас список здобичі (кількість, ✕)
    // і перемикач активного предмета для заявок
    if (!dropItems.some(i => i.id === ui.claimItemId)) ui.claimItemId = dropItems[0].id;

      invalidateCalc(); save(); renderTab2();
    }));
  // масові кнопки діють на відфільтрованих гравців і поточний предмет
  const bulkClaim = on => {
    for (const p of pa().players.filter(p => p.isActive).filter(classFilterMatch)) {
      setClaim(p.id, ui.claimItemId, on);
    }
    invalidateCalc(); save(); renderTab2();
  };
  tab.querySelector('#btnClaimAll')?.addEventListener('click', () => bulkClaim(true));
  tab.querySelector('#btnClaimNone')?.addEventListener('click', () => bulkClaim(false));
}
function setClaim(pid, itemId, on) {
  const list = claimsOf(pid);
  const idx = list.indexOf(itemId);
  if (on) {
    if (idx < 0) list.push(itemId);
  } else if (idx >= 0) {
    list.splice(idx, 1);
  }
}
function addDrop(itemId, qty) {
  const d = draft();
  qty = Math.max(1, Math.round(qty));
  const existing = d.drops.find(x => x.itemId === itemId);
  if (existing) existing.quantity += qty;
  else d.drops.push({ itemId, quantity: qty });
  invalidateCalc(); save(); renderTab2();
}

// Мініатюри в картці Discord тягне з опублікованого сайта: локальні шляхи
// (file:// чи localhost) він не дістане.
const ICON_BASE = 'https://yourbugsbynny.github.io/loot-manager/';
const DiscordWebhookService = {
  async send(url, payloads) {
    if (!LMCore.isWebhookUrl(url)) throw new Error(t('dcBadUrl'));
    // послідовно: паралельні запити Discord переставляє місцями
    for (const payload of payloads) await this.post(url, payload, false);
  },
  async post(url, payload, retried) {
    let res;
    try {
      res = await fetch(url + '?wait=true', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (err) { throw new Error(t('dcNetwork', err.message)); }
    if (res.status === 429 && !retried) {
      const body = await res.json().catch(() => ({}));
      const waitMs = Math.min(10000, Math.ceil((Number(body.retry_after) || 1) * 1000));
      await new Promise(r => setTimeout(r, waitMs));
      return this.post(url, payload, true);
    }
    if (res.status === 401 || res.status === 403 || res.status === 404) {
      throw new Error(t('dcGone'));
    }
    if (!res.ok) throw new Error(t('dcHttp', res.status));
  }
};

function runCalc() {
  const d = draft();
  return LMCore.distribute({
    session: d,
    playersById: byId(pa().players),
    classesById: byId(db.classes),
    itemsById: byId(db.items),
    history: pa().history,
    settings: db.settings,
    nowISO: nowISO(),
    rng: Math.random,
    overrides: d.overrides,
    rollMemo: d.rollMemo
  });
}

        '</select></div></div>';
    };
    // v3.0.0: позиції згруповані у два етапи в порядку, заданому на вкладці 1
    const first = d.firstGroup === 'B' ? 'B' : 'A';
    const groupLabel = g => (g === 'A' ? t('groupA') : t('groupB'));
    const rows = d.firstGroup === 'ALL'

        }).join('');
    const reportText = LMCore.formatReport({

      lang: lang(), firstGroup: d.firstGroup });
    // v5.0.0: у чат — ніки, у Discord — згадки. Поле readonly, тож розбіжності

      save(); renderTab3();

  tab.querySelector('#btnCopy')?.addEventListener('click', async () => {

  tab.querySelector('#btnConfirm')?.addEventListener('click', async () => {

ui.tab4open = ui.tab4open || new Set(['alliances']);
ui.histFilter = ui.histFilter || { playerId: '', from: '', to: '' };

function mutated() { ui.calcResult = null; ui.dcSent = false; save(); }
function anyHistoryHasItem(itemId) {
  return Object.values(db.perAlliance).some(x => x.history.some(r => r.itemId === itemId));
}
function anyPlayerHasClass(classId) {
  return Object.values(db.perAlliance).some(x => x.players.some(p => p.classId === classId));
}
function sect(id, title, bodyHtml) {
  return '<details class="sect" data-sect="' + id + '"' +
    (ui.tab4open.has(id) ? ' open' : '') + '><summary>' + title + '</summary>' +
    '<div class="sect-body">' + bodyHtml + '</div></details>';
}

function renderTab4() {
  const paData = pa();
  const clsOptions = sel => db.classes.filter(c => !c.isArchived || c.id === sel)
    .map(c => '<option value="' + c.id + '"' + (c.id === sel ? ' selected' : '') + '>' +

  /* — Альянси — */

    db.alliances.map(a => '<div class="roster-row">' +

      '<td class="row">' +
        '<button class="btn btn-sm btnArchItem" data-iid="' + i.id + '">' +

      '</tr>').join('') +
    '</tbody></table></div>' +
    '<p class="muted small">' + t('newItemHint') + '</p>';

  /* — Класи — */
  const classesHtml =
    '<div class="table-wrap"><table><thead><tr><th>' + t('thName') +
      '</th><th>' + t('thGroup') +
      '</th><th>w<sub>dmg</sub></th><th>w<sub>taken</sub></th><th>w<sub>heal</sub></th><th></th></tr></thead><tbody>' +
    db.classes.map(c => '<tr' + (c.isArchived ? ' class="cancelled"' : '') + '>' +
      '<td><input type="text" class="inpClsName" data-cid="' + c.id + '" value="' +
        escapeHtml(c.name) + '" maxlength="30" style="width:130px"></td>' +
      '<td><select class="selClsGroup" data-cid="' + c.id + '">' +
        '<option value="A"' + (c.group === 'A' ? ' selected' : '') + '>' + t('groupA') + '</option>' +
        '<option value="B"' + (c.group === 'A' ? '' : ' selected') + '>' + t('groupB') + '</option>' +
      '</select></td>' +
      ['wDmg', 'wTaken', 'wHeal'].map(k =>
        '<td><input type="number" class="inpClsW" data-cid="' + c.id + '" data-w="' + k +

      '<td class="row"><button class="btn btn-sm btnArchCls" data-cid="' + c.id + '">' +

      '<button class="btn btn-sm btn-danger btnDelCls" data-cid="' + c.id + '">✕</button></td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="row" style="margin-top:8px">' +
      '<input type="text" id="inpNewClsName" placeholder="' + t('classNamePh') + '" maxlength="30" class="grow">' +
      '<button class="btn btn-primary btn-sm" id="btnAddCls">' + t('addClass') + '</button></div>';

  /* — Типи івентів — */
  const eventsHtml = paData.eventTypes.length === 0
    ? '<p class="muted">' + t('eventsEmpty') + '</p>'
    : paData.eventTypes.map((ev, idx) => '<div class="roster-row"><span class="grow">' +
        escapeHtml(ev) + '</span><button class="btn btn-sm btn-danger btnDelEvent" data-idx="' +
        idx + '">✕</button></div>').join('');

  /* — Історія — */
  const f = ui.histFilter;
  const histShown = paData.history.filter(r => {
    if (f.playerId && r.playerId !== f.playerId) return false;
    if (f.from && r.timestamp < f.from) return false;

    '<div class="row">' +
      '<select id="histPlayerFilter"><option value="">' + t('allPlayersOpt') + '</option>' +
        paData.players.map(p => '<option value="' + p.id + '"' +
          (p.id === f.playerId ? ' selected' : '') + '>' + escapeHtml(p.nickname) + '</option>').join('') +

      '<label class="inline small">' + t('histTo') + ' <input type="date" id="histTo" value="' +

      '<label class="inline small">' + t('fmtLabel') +
        ' <select id="selDcFormat">' +
          '<option value="text"' + (st.discordFormat !== 'embed' ? ' selected' : '') + '>' +
            t('fmtText') + '</option>' +
          '<option value="embed"' + (st.discordFormat === 'embed' ? ' selected' : '') + '>' +
            t('fmtEmbed') + '</option>' +
        '</select></label>' +
      '<span class="muted small">' + t('fmtHint') + '</span>' +
    '</div><p class="small muted" style="margin:8px 0 4px">' + t('queueRule') + '</p>' +
    '<div class="row">' +
      '<label class="inline small"><input type="checkbox" id="chkUseTop"' +
        (st.useTop !== false ? ' checked' : '') + '> ' + t('setUseTop') + '</label>' +
    '</div><div class="row" style="margin-top:8px">' +
      '<button class="btn btn-sm" id="btnResetSettings">' + t('resetDefaults') + '</button></div>';

function wireTab4() {
  const tab = document.getElementById('tab4');
  tab.querySelectorAll('details.sect').forEach(dEl =>
    dEl.addEventListener('toggle', () => {
      if (dEl.open) ui.tab4open.add(dEl.dataset.sect);
      else ui.tab4open.delete(dEl.dataset.sect);
    }));
  wireClassFilter(tab, renderTab4);

  /* Альянси */
  tab.querySelector('#btnAddAlliance').addEventListener('click', () => {
    const name = tab.querySelector('#inpNewAlliance').value.trim();
    if (!name) { banner(t('enterAllianceName')); return; }
    if (db.alliances.some(a => a.name.toLowerCase() === name.toLowerCase())) {
      banner(t('allianceExists')); return;
    }
    const a = { id: LMCore.uuid(), name, createdAt: nowISO() };
    db.alliances.push(a);
    db.perAlliance[a.id] = { players: [], history: [], eventTypes: [], draftSession: null };
    mutated(); renderAll(); renderTab4();
  });
  tab.querySelectorAll('.inpAllianceName').forEach(inp =>
    inp.addEventListener('change', e => {
      const a = db.alliances.find(x => x.id === e.target.dataset.aid);
      const name = e.target.value.trim();
      if (!name) { e.target.value = a.name; return; }
      a.name = name; mutated(); renderHeader();
    }));
  tab.querySelectorAll('.inpAllianceHook').forEach(inp =>
    inp.addEventListener('change', e => {
      const a = db.alliances.find(x => x.id === e.target.dataset.aid);
      const v = e.target.value.trim();
      if (v && !LMCore.isWebhookUrl(v)) { banner(t('dcBadUrl')); return; }
      a.webhookUrl = v; save(); renderTab4();
    }));
  tab.querySelectorAll('.btnTestHook').forEach(b =>
    b.addEventListener('click', async e => {
      const a = db.alliances.find(x => x.id === e.target.dataset.aid);
      e.target.disabled = true;
      try {
        await DiscordWebhookService.send(a.webhookUrl,
          [{ content: t('dcTestMsg'), allowed_mentions: { parse: [], users: [] } }]);
        banner(t('dcTestOk'));
      } catch (err) { banner(t('dcFail', err.message)); }
      e.target.disabled = false;
    }));
  tab.querySelectorAll('.btnDelAlliance').forEach(b =>
    b.addEventListener('click', e => {
      if (db.alliances.length <= 1) { banner(t('lastAlliance')); return; }
      const a = db.alliances.find(x => x.id === e.target.dataset.aid);
      if (!confirm(t('delAllianceConfirm', a.name))) return;
      db.alliances = db.alliances.filter(x => x.id !== a.id);
      delete db.perAlliance[a.id];
      if (db.activeAllianceId === a.id) db.activeAllianceId = db.alliances[0].id;
      mutated(); renderAll(); renderTab4();
    }));

  /* Гравці */
  tab.querySelector('#btnAddPlayer').addEventListener('click', () => {
    const nick = tab.querySelector('#inpNewNick').value.trim();
    if (!nick) { banner(t('enterNick')); return; }
    if (pa().players.some(p => p.nickname.toLowerCase() === nick.toLowerCase())) {
      banner(t('nickExists')); return;
    }
    pa().players.push({ id: LMCore.uuid(), nickname: nick,
      classId: tab.querySelector('#selNewClass').value,
      role: tab.querySelector('#selNewRole').value, isActive: true, createdAt: nowISO() });
    mutated(); renderTab4();
  });
  tab.querySelectorAll('.inpNick').forEach(inp =>
    inp.addEventListener('change', e => {
      const p = pa().players.find(x => x.id === e.target.dataset.pid);
      const nick = e.target.value.trim();
      if (!nick) { e.target.value = p.nickname; return; }
      if (pa().players.some(x => x.id !== p.id &&
          x.nickname.toLowerCase() === nick.toLowerCase())) {
        banner(t('nickTaken')); e.target.value = p.nickname; return;
      }
      p.nickname = nick; mutated();
    }));
  tab.querySelectorAll('.selClass').forEach(sel =>
    sel.addEventListener('change', e => {
      pa().players.find(x => x.id === e.target.dataset.pid).classId = e.target.value; mutated();
    }));
  tab.querySelectorAll('.selRole').forEach(sel =>
    sel.addEventListener('change', e => {
      pa().players.find(x => x.id === e.target.dataset.pid).role = e.target.value; mutated();
    }));
  tab.querySelectorAll('.inpLevel').forEach(inp =>
    inp.addEventListener('change', e => {
      const p = pa().players.find(x => x.id === e.target.dataset.pid);
      const raw = Number(e.target.value);
      p.level = raw >= 1 ? Math.round(raw) : null;
      e.target.value = p.level || '';
      mutated();
    }));
  tab.querySelectorAll('.inpDiscordId').forEach(inp =>
    inp.addEventListener('change', e => {
      const p = pa().players.find(x => x.id === e.target.dataset.pid);
      const v = e.target.value.trim();
      if (v && !/^\d{17,20}$/.test(v)) { banner(t('dcBadId')); e.target.value = p.discordId || ''; return; }
      p.discordId = v || null; save();
    }));
  tab.querySelector('#btnImportIds').addEventListener('click', () => {
    const parsed = LMCore.parseDiscordIds(tab.querySelector('#idsText').value);
    const res = LMCore.applyDiscordIds(pa().players, parsed.pairs);
    save(); renderTab4();
    banner(t('idsResult', res.updated, res.unknown.length, parsed.bad.length));
  });
  tab.querySelector('#btnImportRoster').addEventListener('click', () => {
    const parsed = LMCore.parseRoster(tab.querySelector('#rosterText').value);
    if (!parsed.ok) { banner(t('rosterFail', parsed.error)); return; }
    // v3.2.0: список із гри повністю замінює склад. Питаємо підтвердження, бо це
    // масова зміна: показуємо, скільки і кого саме буде виведено зі складу.
    const inList = new Set();
    for (const g of parsed.groups) {
      for (const rp of g.players) inList.add(rp.nickname.trim().toLowerCase());
    }
    const leaving = pa().players.filter(p =>
      p.isActive !== false && !inList.has(p.nickname.trim().toLowerCase()));
    if (leaving.length > 0) {
      const names = leaving.slice(0, 10).map(p => p.nickname).join(', ') +
        (leaving.length > 10 ? ', …' : '');
      if (!confirm(t('rosterReplaceConfirm', leaving.length, names))) return;
    }
    const res = LMCore.applyRoster(pa().players, db.classes, parsed.groups, nowISO(),
      { replaceRoster: true });
    const d = pa().draftSession;      // гігієна чернетки: вибулий втрачає ТОП і заявки
    if (d) {
      for (const p of pa().players) {
        if (p.isActive === false) { delete d.presence[p.id]; delete d.claims[p.id]; }
      }
    }
    mutated(); renderTab4();
    banner(t('rosterDone', res.addedPlayers, res.updatedPlayers, res.addedClasses,
      res.deactivated));
  });
  tab.querySelectorAll('.chkActive').forEach(c =>
    c.addEventListener('change', e => {
      const p = pa().players.find(x => x.id === e.target.dataset.pid);
      p.isActive = e.target.checked;
      const d = pa().draftSession;
      if (!p.isActive && d) {   // гігієна чернетки: вибулий втрачає присутність і заявки
        delete d.presence[p.id];
        delete d.claims[p.id];
      }
      mutated(); renderTab4();
    }));
  tab.querySelectorAll('.btnDelPlayer').forEach(b =>
    b.addEventListener('click', e => {
      const p = pa().players.find(x => x.id === e.target.dataset.pid);
      if (pa().history.some(r => r.playerId === p.id)) {
        banner(t('playerHasHistory'));
        return;
      }
      if (!confirm(t('delPlayerConfirm', p.nickname))) return;
      pa().players = pa().players.filter(x => x.id !== p.id);
      const d = pa().draftSession;
      if (d) { delete d.presence[p.id]; delete d.claims[p.id]; }
      mutated(); renderTab4();
    }));

  /* Предмети */
  const applyCatalog = parsed => {
    const v = LMCore.validateCatalog(parsed);
    if (!v.ok) { banner(t('importRejected', v.error)); return; }
    const res = LMCore.syncCatalog(db.items, parsed);
    mutated(); renderTab4();
    banner(t('syncDone', res.added, res.updated));
  };
  tab.querySelector('#btnSyncCatalog').addEventListener('click', async () => {
    try {
      const r = await fetch('data/loot.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      applyCatalog(await r.json());
    } catch (err) {   // file:// або нема сервера — просимо файл вручну
      banner(t('syncPickHint'));
      tab.querySelector('#catalogFile').click();
    }
  });
  tab.querySelector('#catalogFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { applyCatalog(JSON.parse(reader.result)); }
      catch (err) { banner(t('notJson', err.message)); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  tab.querySelector('#inpItemFilter').addEventListener('input', e => {
    ui.itemFilter = e.target.value; renderTab4();
    const inp = document.getElementById('inpItemFilter');
    inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  });
  tab.querySelectorAll('.inpItemName').forEach(inp =>
    inp.addEventListener('change', e => {
      const it = db.items.find(x => x.id === e.target.dataset.iid);
      const name = e.target.value.trim();
      if (!name) { e.target.value = it.name; return; }
      if (db.items.some(x => x.id !== it.id && x.name.toLowerCase() === name.toLowerCase())) {
        banner(t('itemExists')); e.target.value = it.name; return;
      }
      it.name = name; mutated();
    }));
  tab.querySelectorAll('.selItemCat').forEach(sel =>
    sel.addEventListener('change', e => {
      db.items.find(x => x.id === e.target.dataset.iid).category = e.target.value; mutated();
    }));
  tab.querySelectorAll('.selItemRarity').forEach(sel =>
    sel.addEventListener('change', e => {
      db.items.find(x => x.id === e.target.dataset.iid).rarity = e.target.value; mutated();
    }));
  tab.querySelectorAll('.chkItemClass').forEach(c =>
    c.addEventListener('change', e => {
      const it = db.items.find(x => x.id === e.target.dataset.iid);
      const cid = e.target.value;
      if (e.target.checked) { if (!it.targetClasses.includes(cid)) it.targetClasses.push(cid); }
      else it.targetClasses = it.targetClasses.filter(x => x !== cid);
      mutated();
    }));
  tab.querySelectorAll('.btnArchItem').forEach(b =>
    b.addEventListener('click', e => {
      const it = db.items.find(x => x.id === e.target.dataset.iid);
      it.isArchived = !it.isArchived; mutated(); renderTab4();
    }));
  tab.querySelectorAll('.btnDelItem').forEach(b =>
    b.addEventListener('click', e => {
      const it = db.items.find(x => x.id === e.target.dataset.iid);
      if (anyHistoryHasItem(it.id)) {
        banner(t('itemInHistory')); return;
      }
      if (!confirm(t('delItemConfirm', it.name))) return;
      db.items = db.items.filter(x => x.id !== it.id);
      for (const x of Object.values(db.perAlliance)) {
        const d = x.draftSession;
        if (d) {
          d.drops = d.drops.filter(dr => dr.itemId !== it.id);
          for (const pid of Object.keys(d.claims)) {
            d.claims[pid] = d.claims[pid].filter(i => i !== it.id);
          }
        }
      }
      mutated(); renderTab4();
    }));

  /* Класи */
  tab.querySelector('#btnAddCls').addEventListener('click', () => {
    const name = tab.querySelector('#inpNewClsName').value.trim();
    if (!name) { banner(t('enterClassName')); return; }
    if (db.classes.some(c => c.name.toLowerCase() === name.toLowerCase())) {
      banner(t('classExists')); return;
    }
    db.classes.push({ id: LMCore.uuid(), name, wDmg: 0.8, wTaken: 0.1, wHeal: 0.1,
      group: LMCore.groupForClassName(name), isArchived: false });
    mutated(); renderTab4();
  });
  tab.querySelectorAll('.inpClsName').forEach(inp =>
    inp.addEventListener('change', e => {
      const c = db.classes.find(x => x.id === e.target.dataset.cid);
      const name = e.target.value.trim();
      if (!name) { e.target.value = c.name; return; }
      c.name = name; mutated();
    }));
  tab.querySelectorAll('.selClsGroup').forEach(sel =>
    sel.addEventListener('change', e => {
      const c = db.classes.find(x => x.id === e.target.dataset.cid);
      c.group = e.target.value === 'A' ? 'A' : 'B';
      mutated();
    }));
  tab.querySelectorAll('.inpClsW').forEach(inp =>
    inp.addEventListener('change', e => {
      const c = db.classes.find(x => x.id === e.target.dataset.cid);
      const v = Math.min(1, Math.max(0, Number(e.target.value) || 0));
      c[e.target.dataset.w] = v; e.target.value = v; mutated();
    }));
  tab.querySelectorAll('.btnArchCls').forEach(b =>
    b.addEventListener('click', e => {
      const c = db.classes.find(x => x.id === e.target.dataset.cid);
      c.isArchived = !c.isArchived; mutated(); renderTab4();
    }));
  tab.querySelectorAll('.btnDelCls').forEach(b =>
    b.addEventListener('click', e => {
      const c = db.classes.find(x => x.id === e.target.dataset.cid);
      if (anyPlayerHasClass(c.id)) {
        banner(t('classHasPlayers')); return;
      }
      if (!confirm(t('delClassConfirm', c.name))) return;
      db.classes = db.classes.filter(x => x.id !== c.id);
      db.items.forEach(i => { i.targetClasses = i.targetClasses.filter(x => x !== c.id); });
      mutated(); renderTab4();
    }));

  /* Типи івентів */
  tab.querySelectorAll('.btnDelEvent').forEach(b =>
    b.addEventListener('click', e => {
      pa().eventTypes.splice(Number(e.target.dataset.idx), 1);
      mutated(); renderTab4();
    }));

  /* Історія */
  tab.querySelector('#histPlayerFilter').addEventListener('change', e => {
    ui.histFilter.playerId = e.target.value; renderTab4();
  });
  tab.querySelector('#histFrom').addEventListener('change', e => {
    ui.histFilter.from = e.target.value; renderTab4();
  });
  tab.querySelector('#histTo').addEventListener('change', e => {
    ui.histFilter.to = e.target.value; renderTab4();
  });
  tab.querySelectorAll('.btnCancelRec').forEach(b =>
    b.addEventListener('click', e => {
      const r = pa().history.find(x => x.id === e.target.dataset.rid);
      if (!confirm(t('cancelRecConfirm', r.itemNameSnapshot, r.playerNicknameSnapshot))) return;
      r.cancelled = true; mutated(); renderTab4();
    }));

  /* Налаштування */
  tab.querySelector('#chkUseTop').addEventListener('change', e => {
    db.settings.useTop = e.target.checked; mutated();
  });
  tab.querySelector('#selDcFormat').addEventListener('change', e => {
    db.settings.discordFormat = e.target.value === 'embed' ? 'embed' : 'text';
    save();
  });
  tab.querySelector('#selLanguage').addEventListener('change', e => {
    db.settings.language = e.target.value;
    mutated(); renderAll();
  });
  tab.querySelector('#btnResetSettings').addEventListener('click', () => {
    if (!confirm(t('resetConfirm'))) return;
    const lg = db.settings.language, fmt = db.settings.discordFormat;
    db.settings = LMCore.defaultSettings();
    db.settings.language = lg;   // мова — не константа алгоритму, скидання її не чіпає
    db.settings.discordFormat = fmt;
    mutated(); renderTab4();
  });

  /* Резервна копія */
  tab.querySelector('#btnExport').addEventListener('click', () => {
    // адреси вебхуків у файл не потрапляють — бекап пересилають (ТЗ §4.5)
    const blob = new Blob([JSON.stringify(LMCore.exportSnapshot(db), null, 2)],
      { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lootmanager-backup-' + nowISO().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  tab.querySelector('#importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (err) { banner(t('notJson', err.message)); return; }
      const v = LMCore.validateImport(parsed);
      if (!v.ok) { banner(t('importRejected', v.error)); return; }
      if (!confirm(t('importConfirm', file.name))) return;
      db = LMCore.keepLocalWebhooks(v.db, db);
      ui.calcResult = null; save(); renderAll(); renderTab4();
      banner(t('imported'));
    };
    reader.readAsText(file);
    e.target.value = '';
  });
}

/* ===== Автозасів (v1.8) =====
   Порожня база наповнюється складом і каталогом із сусідніх файлів:
   data/seed.json (альянс, гравці, типи івентів) + data/loot.json (предмети).
   Чужі дані ніколи не чіпаються: працює лише коли LMCore.isPristine(db) === true.
   На file:// fetch недоступний — засів тихо пропускається, все вноситься вручну. */
async function bootstrapSeed() {
  if (!LMCore.isPristine(db)) return;
  let seeded = false, players = 0, items = 0, allianceName = '';
  try {
    const r = await fetch('data/seed.json', { cache: 'no-store' });
    if (r.ok) {
      const seed = await r.json();
      if (seed.allianceName) {
        activeAlliance().name = seed.allianceName;
        allianceName = seed.allianceName;
      }
      if (Array.isArray(seed.eventTypes)) pa().eventTypes.push(...seed.eventTypes);
      const parsed = LMCore.parseRoster(seed.roster || '');
      if (parsed.ok) {
        const res = LMCore.applyRoster(pa().players, db.classes, parsed.groups, nowISO());
        players = res.addedPlayers;
      }
      seeded = true;
    }
  } catch (e) { /* немає файлу або file:// — працюємо з порожньою базою */ }
  try {
    const r = await fetch('data/loot.json', { cache: 'no-store' });
    if (r.ok) {
      const catalog = await r.json();
      if (LMCore.validateCatalog(catalog).ok) {
        items = LMCore.syncCatalog(db.items, catalog).added;
        seeded = true;
      }
    }
  } catch (e) { /* каталогу поруч немає — не біда */ }
  if (!seeded) return;
  save(); renderAll();
  banner(t('seedDone', allianceName || activeAlliance().name, players, items));
}

/* ===== Ініціалізація ===== */
document.addEventListener('DOMContentLoaded', () => {
  db = load();
  save();
  document.getElementById('bannerClose').addEventListener('click', () => {
    document.getElementById('banner').hidden = true;
  });
  document.getElementById('allianceSelect').addEventListener('change', e => {
    db.activeAllianceId = e.target.value;
    save(); renderAll();
  });
  document.getElementById('langSwitch').addEventListener('click', e => {
    const btn = e.target.closest('.lang-btn');
    if (!btn || btn.dataset.lang === lang()) return;   // клік по активній мові — не робота
    db.settings.language = btn.dataset.lang;
    save(); renderAll();
  });
  document.getElementById('btnSettings').addEventListener('click', () => switchTab(4));
  document.querySelectorAll('nav.tabs .tab').forEach(b =>
    b.addEventListener('click', () => switchTab(Number(b.dataset.tab))));
  window.addEventListener('resize', syncStickyOffset);
  renderAll();
  bootstrapSeed();
});
</script>
